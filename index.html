# About

Hello! I am Shuang Chen. I currently work for the AI inference infrastructure team at Bytedance Seed. Prior to this, I focused on improving resource efficiency for AI inference infrastructure (mainly on Ascend NPUs) and public cloud platforms in Huawei. 

I received my Ph.D. in Computer Engineering from Cornell University in 2021, under the supervision of Prof. José F. Martínez and Prof. Christina Delimitrou. My thesis is on QoS-aware resource management of interactive services in datacenters. I earned my B.S. in Computer Science from the ACM Class at Shanghai Jiao Tong University in 2015.

I am broadly interested in computer architecture and computer systems. Starting from 2023, my engineering and research efforts have centered on boosting resource utilization for LLM infrastructure, including (but not limited to) supporting LLM multi-tenancy, optimizing AI supernode, and developing ultra-low-latency inference systems.
I am dedicated to fully unlocking the potential of AI chips and hardware architectures, continuously pushing the frontier of AI performance and cost efficiency.
